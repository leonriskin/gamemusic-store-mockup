# Sync tracks/catalog.json (+ track-meta.json when present) to R2 on push.
# Track media (.mp3, .zip, cover.jpg) is NOT in git — upload those from your machine
# via the pre-push hook (git push) or: npm run upload:r2
#
# GitHub secrets (repo Settings → Secrets → Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Optional: R2_BUCKET (default riskin-tracks), R2_PUBLIC_BASE_URL
name: Upload catalog to R2

on:
  push:
    branches: [main, master]
    paths:
      - 'tracks/catalog.json'
      - 'tracks/track-meta.json'
      - 'scripts/upload-r2.mjs'
      - '.github/workflows/r2-upload.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Upload JSON catalog to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: node scripts/upload-r2.mjs
