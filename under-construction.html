<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Riskin Tracks — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14161c;
      --border: rgba(255,255,255,0.08);
      --text: #f2f3f7;
      --text-muted: #8b92a8;
      --accent: #5eead4;
      --accent-dim: rgba(94,234,212,0.12);
      --font: "DM Sans", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(94,234,212,0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(245,158,108,0.06), transparent);
      pointer-events: none;
    }

    .page {
      position: relative;
      max-width: 520px;
      width: 100%;
    }

    .logo {
      display: inline-block;
      margin-bottom: 48px;
      line-height: 0;
    }

    .logo img {
      height: clamp(44px, 8vw, 56px);
      width: auto;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(94,234,212,0.25);
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(36px, 7vw, 52px);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 420px;
      margin: 0 auto;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 32px auto;
    }

    .tagline {
      font-size: 14px;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="logo" href="/" aria-label="Riskin Tracks">
      <img src="assets/riskin-tracks-logo-header.png?v=1" width="1341" height="352" alt="Riskin Tracks" decoding="async" />
    </a>

    <div class="badge">Under construction</div>

    <h1>Coming soon</h1>
    <p>
      We're building something new — a curated music store for indie game developers.
      Check back soon.
    </p>

    <div class="divider"></div>
    <p class="tagline">Music for indie games</p>
  </main>
</body>
</html>
