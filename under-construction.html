<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Riskin Tracks — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14161c;
      --border: rgba(255,255,255,0.08);
      --text: #f2f3f7;
      --text-muted: #8b92a8;
      --accent: #5eead4;
      --accent-dim: rgba(94,234,212,0.12);
      --accent-hover: #7af0dc;
      --danger: #f87171;
      --font: "DM Sans", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero-plane {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 5vw, 56px) clamp(20px, 5vw, 48px) 40px;
      background:
        radial-gradient(ellipse 90% 55% at 15% 10%, rgba(94,234,212,0.11), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 85%, rgba(245,158,108,0.07), transparent 50%),
        linear-gradient(180deg, #0e1016 0%, var(--bg) 45%, #0a0b0e 100%);
    }

    .hero-plane::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      animation: rise 0.7s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: block;
      margin-bottom: clamp(36px, 7vw, 52px);
    }

    .logo img {
      height: clamp(52px, 8vw, 68px);
      width: auto;
      display: block;
    }

    .headline {
      font-family: var(--serif);
      font-size: clamp(34px, 6.5vw, 48px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      max-width: 14ch;
    }

    .support {
      font-size: 17px;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 36ch;
      margin-bottom: 32px;
    }

    .signup {
      display: flex;
      gap: 10px;
      align-items: stretch;
      max-width: 480px;
    }

    .signup input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(20, 22, 28, 0.85);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      backdrop-filter: blur(8px);
    }

    .signup input[type="email"]::placeholder { color: var(--text-muted); opacity: 0.8; }
    .signup input[type="email"]:focus {
      outline: none;
      border-color: rgba(94,234,212,0.45);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .signup-btn {
      flex-shrink: 0;
      padding: 16px 22px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #0c0d10;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
    }

    .signup-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .signup-btn:active:not(:disabled) { transform: scale(0.98); }
    .signup-btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .fineprint {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      opacity: 0.85;
      max-width: 40ch;
    }

    .fineprint em {
      font-style: normal;
      color: var(--text);
      opacity: 0.9;
    }

    .waitlist-status {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.45;
      min-height: 20px;
    }

    .waitlist-status.success { color: var(--accent); }
    .waitlist-status.error { color: var(--danger); }

    .after {
      margin-top: clamp(48px, 10vw, 72px);
      padding-top: 28px;
      border-top: 1px solid var(--border);
      animation: rise 0.7s ease-out 0.15s both;
    }

    .after-label {
      font-family: var(--serif);
      font-style: italic;
      font-size: 18px;
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 16px;
    }

    .mini-player {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 360px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(20, 22, 28, 0.7);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .mini-player.is-playing {
      border-color: rgba(94,234,212,0.22);
      box-shadow: 0 0 0 1px rgba(94,234,212,0.06);
    }

    .player-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .player-btn:hover { background: rgba(94,234,212,0.2); }
    .player-btn:active { transform: scale(0.96); }
    .player-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .player-btn .icon-pause { display: none; }
    .mini-player.is-playing .player-btn .icon-play { display: none; }
    .mini-player.is-playing .player-btn .icon-pause { display: block; }

    .player-cover {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(255,255,255,0.04);
    }

    .player-meta { min-width: 0; flex: 1; }
    .player-title {
      display: block;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-duration {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-line {
      margin-top: 36px;
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.7;
    }
    .footer-line a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .footer-line a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      .signup { flex-direction: column; }
      .signup-btn { width: 100%; }
      .headline { max-width: none; }
    }
  </style>
</head>
<body>
  <section class="hero-plane" aria-label="Coming soon">
    <div class="shell">
      <a class="logo" href="/" aria-label="Riskin Tracks">
        <img src="assets/riskin-tracks-logo-header.png?v=1" width="1341" height="352" alt="Riskin Tracks" decoding="async" />
      </a>

      <h1 class="headline">Get in before we open</h1>
      <p class="support">
        Sign up for early access and launch discounts on soundtrack packs for indie games.
      </p>

      <form class="signup" id="waitlistForm" novalidate>
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <label class="visually-hidden" for="waitlistEmail" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Email</label>
        <input
          id="waitlistEmail"
          name="email"
          type="email"
          required
          autocomplete="email"
          placeholder="you@studio.com"
          inputmode="email"
        />
        <button type="submit" class="signup-btn" id="waitlistBtn">Get early access</button>
      </form>
      <p class="fineprint">
        Early list members get <em>launch discounts</em> and first notice when the store opens. No spam.
      </p>
      <p class="waitlist-status" id="waitlistStatus" role="status"></p>

      <div class="after">
        <p class="after-label">Meanwhile, enjoy some Midnight Strawberries</p>
        <div class="mini-player" id="miniPlayer">
          <button type="button" class="player-btn" id="playerBtn" aria-label="Play Midnight Strawberries">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <img class="player-cover" id="playerCover" src="" width="48" height="48" alt="Midnight Strawberries cover art" decoding="async" />
          <div class="player-meta">
            <span class="player-title">Midnight Strawberries</span>
            <span class="player-duration">1:12</span>
          </div>
          <audio id="demoAudio" preload="none" loop></audio>
        </div>
      </div>

      <p class="footer-line">
        Teasers on X · <a href="https://x.com/Leon_Riskin" target="_blank" rel="noopener noreferrer">@Leon_Riskin</a>
      </p>
    </div>
  </section>

  <script>
    (function () {
      const TRACK_SLUG = 'midnight-strawberries';
      const R2_ASSET_BASE = 'https://pub-45a1df6488174a1a84baf1ed003ac6dd.r2.dev';
      const WAITLIST_ENDPOINT = '/.netlify/functions/waitlist';
      const IS_LOCAL_HOST = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const IS_STATIC_DEV_SERVER = IS_LOCAL_HOST && location.port === '8765';

      function isLocalDev() {
        const h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1') return true;
        if (location.protocol === 'file:') return true;
        return false;
      }

      function resolveAssetUrl(path) {
        if (!path || /^https?:\/\//i.test(path)) return path;
        if (isLocalDev()) return path;
        const rel = path.replace(/^\.\//, '').replace(/^\//, '');
        return `${R2_ASSET_BASE}/${rel}`;
      }

      const demoPath = `tracks/${TRACK_SLUG}/demo.mp3`;
      const coverPath = `tracks/${TRACK_SLUG}/cover.jpg`;

      const player = document.getElementById('miniPlayer');
      const btn = document.getElementById('playerBtn');
      const audio = document.getElementById('demoAudio');
      const cover = document.getElementById('playerCover');

      audio.src = resolveAssetUrl(demoPath);
      cover.src = resolveAssetUrl(coverPath);

      function setPlaying(playing) {
        player.classList.toggle('is-playing', playing);
        btn.setAttribute('aria-label', playing ? 'Pause Midnight Strawberries' : 'Play Midnight Strawberries');
      }

      btn.addEventListener('click', function () {
        if (audio.paused) {
          audio.play().catch(function () {});
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function () { setPlaying(true); });
      audio.addEventListener('pause', function () { setPlaying(false); });

      const form = document.getElementById('waitlistForm');
      const submitBtn = document.getElementById('waitlistBtn');
      const statusEl = document.getElementById('waitlistStatus');
      const emailInput = document.getElementById('waitlistEmail');

      function staticServerMessage() {
        return 'Waitlist signup only works with npm run dev at http://localhost:8888 (Netlify functions).';
      }

      function formatError(res, data, fallback) {
        if (IS_STATIC_DEV_SERVER || (IS_LOCAL_HOST && res && res.status === 404)) {
          return staticServerMessage();
        }
        const parts = [data.error || fallback];
        if (IS_LOCAL_HOST && data.detail) parts.push(String(data.detail));
        return parts.filter(Boolean).join(' — ');
      }

      if (IS_STATIC_DEV_SERVER) {
        statusEl.textContent = staticServerMessage();
        statusEl.className = 'waitlist-status error';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) {
          statusEl.textContent = 'Enter your email to join.';
          statusEl.className = 'waitlist-status error';
          emailInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Joining…';
        statusEl.textContent = '';
        statusEl.className = 'waitlist-status';

        fetch(WAITLIST_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({
            email: email,
            _honey: form._honey?.value || '',
          }),
        })
          .then(async function (res) {
            const data = await res.json().catch(function () { return {}; });
            if (!res.ok) throw new Error(formatError(res, data, 'Signup failed'));
            return data;
          })
          .then(function () {
            statusEl.textContent = 'You\'re on the list. Check your inbox for the welcome email.';
            statusEl.className = 'waitlist-status success';
            form.reset();
          })
          .catch(function (err) {
            var msg = err.message || 'Could not join right now. Please try again in a moment.';
            if (IS_STATIC_DEV_SERVER && (msg === 'Failed to fetch' || msg === 'Signup failed')) {
              msg = staticServerMessage();
            }
            statusEl.textContent = msg;
            statusEl.className = 'waitlist-status error';
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Get early access';
          });
      });
    })();
  </script>
</body>
</html>
